
{% extends "base.html" %}

{% block title %}Change Password | AIMT{% endblock %}

{% block head %}
<style>
.change-password-page {
    max-width: 520px;
    margin: 35px auto;
    padding: 20px;
}

.password-card {
    background: #fff;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,.15);
}

.password-card h2 {
    color: #173b78;
    margin: 0 0 10px;
    text-align: center;
}

.password-card .subtitle {
    color: #64748b;
    text-align: center;
    margin-bottom: 25px;
}

.password-group {
    margin-bottom: 18px;
}

.password-group label {
    display: block;
    margin-bottom: 8px;
    color: #172033;
    font-weight: 700;
}

.password-group input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border: 1px solid #9aaecb;
    border-radius: 9px;
    font-size: 15px;
}

.password-group input:focus {
    outline: none;
    border-color: #2458a5;
    box-shadow: 0 0 0 3px rgba(36,88,165,.15);
}

.show-password {
    margin-top: 9px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #475569;
    font-size: 13px;
}

.show-password input {
    width: auto;
}

.password-submit {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #173b78;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.password-submit:hover {
    background: #0c2857;
}

.password-back {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #173b78;
    text-decoration: none;
    font-weight: bold;
}

@media (max-width: 600px) {
    .change-password-page {
        margin: 15px auto;
        padding: 12px;
    }

    .password-card {
        padding: 22px 17px;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="change-password-page">
    <div class="password-card">

        <h2>Change Password</h2>
        <p class="subtitle">Update your AIMT account password</p>

        <form method="POST" action="{{ url_for('change_password') }}">

            <div class="password-group">
                <label for="current_password">Current Password</label>
                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    autocomplete="current-password"
                    required>
            </div>

            <div class="password-group">
                <label for="new_password">New Password</label>
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    minlength="8"
                    autocomplete="new-password"
                    required>
            </div>

            <div class="password-group">
                <label for="confirm_password">Confirm New Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="8"
                    autocomplete="new-password"
                    required>
            </div>

            <label class="show-password">
                <input type="checkbox" onclick="togglePasswords()">
                Show Passwords
            </label>

            <button type="submit" class="password-submit">
                Update Password
            </button>

        </form>

        <a class="password-back" href="{{ url_for('profile') }}">
            ← Back to Profile
        </a>

    </div>
</div>

<script>
function togglePasswords() {
    const fields = [
        document.getElementById("current_password"),
        document.getElementById("new_password"),
        document.getElementById("confirm_password")
    ];

    fields.forEach(function(field) {
        field.type = field.type === "password" ? "text" : "password";
    });
}
</script>
{% endblock %}
